<!doctype html>
<html lang="en">
<head>

  <meta name="referrer" content="no-referrer">

  <title>futu_algo</title>

  <link rel="stylesheet" href="/static/app.css">

  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">

      <div class="brand">
        <img class="brand-mark" src="/static/favicon.svg" alt="" width="26" height="26">
        <span class="brand-name">futu<span>_</span>algo</span>
        <span class="brand-tag">HK</span>

        </div>
      </div>
    </aside>
    <div class="nav-scrim" id="nav-scrim" hidden></div>
    <div class="main">
      <header class="topbar">

        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <div id="banners"></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
